#
# Continuous integration for Capricorn. Requires no secrets, no cloud
# credentials and no model downloads: inference is exercised against the
# deterministic mock Ollama server. Real-model smoke tests are run manually
# (see docs/TESTING.md).

name: 'CI'

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
  # Weekly full run, so the macOS job (skipped on pushes) still runs on main.
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  checks:
    name: 'Lint, typecheck, unit tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: 'Install'
        run: 'npm ci'
      - name: 'Format check'
        run: 'npx prettier --check .'
      - name: 'Build'
        run: 'npm run build'
      - name: 'Lint'
        run: 'npm run lint'
      - name: 'Typecheck'
        run: 'npm run typecheck'
      - name: 'Install bubblewrap (sandbox integration tests)'
        # Same as upstream CI: the retained SandboxManager tests run real
        # bwrap, which the runner image lacks, and Ubuntu 24.04's AppArmor
        # policy blocks the unprivileged user namespaces it needs.
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 'Unit tests (core)'
        run: 'npm run test:ci -w @google/gemini-cli-core'

  cli-tests:
    # The CLI suite (~460 files) takes ~110 min on a 4-CPU hosted runner;
    # upstream runs it on 16-core runners. Split it across parallel jobs.
    name: 'Unit tests (cli ${{ matrix.shard }}/4)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: 'npm ci'
      # CLI tests resolve @google/gemini-cli-core from packages/core/dist.
      - run: 'npm run build'
      - name: 'Unit tests (cli)'
        # Coverage off: nothing consumes it here and it slows the run.
        run: 'npm run test:ci -w @google/gemini-cli -- --shard=${{ matrix.shard }}/4 --coverage.enabled=false'

  e2e:
    name: 'End-to-end (Linux, offline)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: 'npm ci'
      - run: 'npm run build'
      - name: 'E2E against mock Ollama'
        run: 'npm run test:e2e:capricorn'
      - name: 'Offline verification (loopback-only network namespace)'
        run: |
          # Ubuntu 24.04 runners block unprivileged user namespaces through
          # AppArmor by default; lift that so the check really runs. It must
          # not be skipped silently: it is the CI proof of no network egress.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run verify:offline
      - name: 'Package smoke test (npm pack + launch)'
        run: 'node scripts/capricorn/pack-smoke.js'

  platforms:
    name: 'Smoke (${{ matrix.os }})'
    # macOS minutes are billed at 10x on a private repo: run on pull
    # requests, manual runs and the weekly schedule, not on every push.
    if: "github.event_name != 'push'"
    strategy:
      fail-fast: false
      matrix:
        # Windows is not a supported platform (decision 2026-11-12).
        os: ['macos-latest']
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 45
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: 'npm ci'
      - run: 'npm run build'
      - name: 'Provider and security unit tests'
        run: 'npx vitest run --root packages/core src/providers src/security src/safety'
      - name: 'E2E against mock Ollama'
        run: 'npm run test:e2e:capricorn'
